<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bauhaus Voice Transcriber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta Bauhaus Actualizada */
            --bauhaus-turquoise: #00D0C6; 
            --bauhaus-black: #1A1A1A;
            --bauhaus-bg: #FFFFFF; /* Fondo blanco tipo papel */
            --bauhaus-red: #D92525;
            
            /* Degradado de azules para el volumen */
            --vol-blue-soft: #7DD3FC; /* Celeste claro */
            --vol-blue-med: #0284C7;  /* Azul medio */
            --vol-blue-loud: #1E3A8A; /* Azul oscuro */
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bauhaus-bg);
            /* Patrón de puntos geométricos de fondo */
            background-image: radial-gradient(var(--bauhaus-black) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            color: var(--bauhaus-black);
        }

        /* Utilidades Bauhaus */
        .bauhaus-border {
            border: 8px solid var(--bauhaus-black);
        }

        .bauhaus-shadow {
            box-shadow: 12px 12px 0px var(--bauhaus-black);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .bauhaus-button:hover {
            transform: translate(-4px, -4px);
            box-shadow: 16px 16px 0px var(--bauhaus-black);
        }

        .bauhaus-button:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px var(--bauhaus-black);
        }

        /* Clases dinámicas de texto basadas en volumen */
        .vol-soft {
            color: var(--vol-blue-soft);
            font-weight: 300;
            font-size: 1.25rem;
            transition: color 0.3s ease;
        }

        .vol-med {
            color: var(--vol-blue-med);
            font-weight: 500;
            font-size: 1.75rem;
            transition: color 0.3s ease;
        }

        .vol-loud {
            color: var(--vol-blue-loud);
            font-weight: 900;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            text-shadow: 2px 2px 0px var(--bauhaus-turquoise);
            transition: color 0.3s ease;
        }

        /* Barra visualizadora */
        #visualizer-bar {
            transition: height 0.05s ease, background-color 0.2s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <main class="w-full max-w-6xl bg-white bauhaus-border bauhaus-shadow flex flex-col z-10 relative">
        
        <!-- Header -->
        <header class="bg-[var(--bauhaus-turquoise)] border-b-[8px] border-black p-6 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
            <div>
                <h1 class="text-4xl md:text-6xl font-black tracking-tighter uppercase leading-none">Voz & Forma</h1>
                <p class="font-bold text-lg mt-2 tracking-widest uppercase border-l-4 border-black pl-3">Transcriptor Bauhaus</p>
            </div>
            
            <!-- Badge de Estado -->
            <div id="status-badge" class="bg-white border-4 border-black px-5 py-2 font-bold uppercase text-sm flex items-center gap-3">
                <span class="w-4 h-4 bg-slate-300 rounded-full border-2 border-black inline-block" id="status-dot"></span>
                <span id="status-text">Sistema Inactivo</span>
            </div>
        </header>

        <div class="flex flex-col md:flex-row min-h-[600px] relative">
            
            <!-- Panel Lateral (Controles) -->
            <aside class="w-full md:w-1/4 border-b-[8px] md:border-b-0 md:border-r-[8px] border-black p-8 bg-[#f8f8f8] flex flex-col items-center gap-10">
                
                <!-- Botón de Micrófono -->
                <button id="mic-btn" class="w-36 h-36 bg-[var(--bauhaus-red)] rounded-full bauhaus-border bauhaus-shadow bauhaus-button flex items-center justify-center relative cursor-pointer group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 text-white z-10 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                    <!-- Onda de grabación interactiva -->
                    <div id="mic-wave" class="absolute inset-0 border-4 border-black rounded-full opacity-0 scale-100 transition-all duration-500"></div>
                </button>

                <!-- Leyenda de colores -->
                <div class="w-full border-4 border-black bg-white p-4">
                    <h3 class="font-black uppercase text-center mb-3 text-sm">Escala de Volumen</h3>
                    <div class="space-y-3 font-bold text-xs">
                        <div class="flex items-center gap-3"><div class="w-6 h-6 bg-[var(--vol-blue-soft)] border-2 border-black"></div> SUAVE</div>
                        <div class="flex items-center gap-3"><div class="w-6 h-6 bg-[var(--vol-blue-med)] border-2 border-black"></div> NORMAL</div>
                        <div class="flex items-center gap-3"><div class="w-6 h-6 bg-[var(--vol-blue-loud)] border-2 border-black"></div> FUERTE</div>
                    </div>
                </div>

                <!-- Visualizador de Volumen Vertical -->
                <div class="w-full flex-1 border-4 border-black bg-white relative flex items-end overflow-hidden min-h-[150px]">
                    <!-- Líneas guías -->
                    <div class="w-full absolute top-1/4 border-t-2 border-dashed border-slate-200 z-0"></div>
                    <div class="w-full absolute top-2/4 border-t-2 border-dashed border-slate-200 z-0"></div>
                    <div class="w-full absolute top-3/4 border-t-2 border-dashed border-slate-200 z-0"></div>
                    
                    <div id="visualizer-bar" class="w-full bg-[var(--vol-blue-soft)] border-t-4 border-black z-10" style="height: 0%;"></div>
                </div>
            </aside>

            <!-- Panel Central (Texto) -->
            <section class="w-full md:w-3/4 p-8 flex flex-col relative bg-white">
                
                <div id="message-box" class="hidden w-full border-4 border-black p-4 mb-6 font-bold"></div>

                <!-- Contenedor del texto transcrito -->
                <div id="transcript-container" class="flex-1 overflow-y-auto flex flex-wrap content-start items-baseline gap-x-2 gap-y-2 pb-24">
                    <div id="placeholder" class="text-3xl font-light text-slate-300 w-full text-center mt-32 leading-relaxed">
                        Haz clic en el círculo rojo para activar el micrófono.<br>
                        <span class="font-bold text-slate-400 text-xl">El texto cambiará de forma según el volumen de tu voz.</span>
                    </div>
                </div>

                <!-- Texto Provisional (Interim) -->
                <div id="interim-container" class="absolute bottom-6 left-8 right-32 border-t-4 border-black border-dashed pt-4 bg-white/90 min-h-[60px]">
                    <p id="interim-text" class="text-xl font-medium text-slate-400 italic"></p>
                </div>
                
                <!-- Botón Limpiar -->
                <button id="clear-btn" class="absolute bottom-6 right-8 bg-[var(--bauhaus-turquoise)] border-4 border-black px-6 py-3 font-black uppercase hover:bg-black hover:text-white transition-colors cursor-pointer opacity-0 pointer-events-none z-20 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-1 active:translate-y-1">
                    Limpiar
                </button>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Referencias del DOM
            const micBtn = document.getElementById('mic-btn');
            const micWave = document.getElementById('mic-wave');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const visualizerBar = document.getElementById('visualizer-bar');
            const transcriptContainer = document.getElementById('transcript-container');
            const interimText = document.getElementById('interim-text');
            const placeholder = document.getElementById('placeholder');
            const clearBtn = document.getElementById('clear-btn');
            const messageBox = document.getElementById('message-box');

            // Estado de la Aplicación
            let isRecording = false;
            let segmentMaxVolume = 0; // Se resetea después de cada oración
            let noiseFloorThreshold = 15; // Ignorar volumen por debajo de esto (ruido blanco)
            
            // Audio API
            let audioContext;
            let analyser;
            let microphone;
            let dataArray;
            let animationFrameId;

            // Speech API
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;

            if (!SpeechRecognition) {
                showMessage("Tu navegador no soporta Web Speech API. Por favor usa Google Chrome.", true);
                micBtn.disabled = true;
                micBtn.style.opacity = '0.5';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true; // BUG FIX: Mantener escuchando
            recognition.interimResults = true; // BUG FIX: Mostrar texto mientras se habla
            recognition.lang = 'es-ES';

            async function initAudioEngine() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.7; // Suaviza el medidor
                    
                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    measureVolume();
                } catch (error) {
                    console.error("Error micrófono:", error);
                    showMessage("Se requiere acceso al micrófono.", true);
                    stopRecording();
                }
            }

            function measureVolume() {
                if (!isRecording) return;
                
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let average = sum / dataArray.length;
                
                // BUG FIX: Solo registrar el max volume si supera el ruido ambiente (noiseFloor)
                // Esto evita que un golpe o el silencio dejen pegado el medidor en un valor incorrecto
                if (average > noiseFloorThreshold) {
                    if (average > segmentMaxVolume) {
                        segmentMaxVolume = average;
                    }
                }

                // Renderizar barra visual
                let heightPercent = Math.min((average / 120) * 100, 100);
                visualizerBar.style.height = `${heightPercent}%`;
                
                // Mapeo dinámico de colores del visualizador
                if (average > 75) {
                    visualizerBar.style.backgroundColor = 'var(--vol-blue-loud)'; // Fuerte
                } else if (average > 35) {
                    visualizerBar.style.backgroundColor = 'var(--vol-blue-med)';  // Normal
                } else {
                    visualizerBar.style.backgroundColor = 'var(--vol-blue-soft)'; // Suave
                }

                animationFrameId = requestAnimationFrame(measureVolume);
            }

            // Asignación de clases por nivel de volumen detectado
            function getVolumeClass(volumeValue) {
                // Calibración ajustada
                if (volumeValue > 75) return 'vol-loud'; // > 75 es fuerte
                if (volumeValue > 35) return 'vol-med';  // 35-75 es normal
                return 'vol-soft';                       // < 35 es suave
            }

            recognition.onstart = () => {
                isRecording = true;
                updateUIState();
                if(!audioContext || audioContext.state === 'closed') {
                    initAudioEngine();
                }
            };

            recognition.onresult = (event) => {
                let currentInterim = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const finalString = event.results[i][0].transcript;
                        
                        // Aplicar clase en base al maxVolume capturado durante esta frase
                        const styleClass = getVolumeClass(segmentMaxVolume);
                        
                        const span = document.createElement('span');
                        span.className = `inline-block ${styleClass}`;
                        span.textContent = finalString + ' ';
                        
                        placeholder.style.display = 'none';
                        clearBtn.classList.remove('opacity-0', 'pointer-events-none');
                        
                        transcriptContainer.appendChild(span);
                        transcriptContainer.scrollTop = transcriptContainer.scrollHeight;

                        // BUG FIX VITAL: Reiniciar el medidor de volumen para la *siguiente* frase
                        segmentMaxVolume = 0; 
                    } else {
                        currentInterim += event.results[i][0].transcript;
                    }
                }

                interimText.textContent = currentInterim;
            };

            // BUG FIX: El "Resucitador". Si el navegador apaga la API sola, la encendemos.
            recognition.onend = () => {
                if (isRecording) {
                    // Un pequeño delay previene que el navegador crashee por reinicios continuos
                    setTimeout(() => {
                        try { recognition.start(); } catch(e) { console.log('Re-start error:', e); }
                    }, 250);
                } else {
                    stopRecording();
                }
            };

            recognition.onerror = (event) => {
                console.warn('Speech API Error:', event.error);
                if (event.error === 'not-allowed') {
                    showMessage("Permiso de micrófono denegado.", true);
                    stopRecording();
                }
                // Si el error es "no-speech" (nadie habla), ignoramos porque onend reiniciará el ciclo.
            };

            function stopRecording() {
                isRecording = false;
                try { recognition.stop(); } catch(e) {}
                
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                
                visualizerBar.style.height = '0%';
                interimText.textContent = '';
                segmentMaxVolume = 0; // Limpiar al detener
                updateUIState();
            }

            function updateUIState() {
                if (isRecording) {
                    statusDot.className = 'w-4 h-4 bg-[var(--bauhaus-turquoise)] rounded-full border-2 border-black animate-pulse inline-block';
                    statusText.textContent = 'Escuchando...';
                    micBtn.classList.replace('bg-[var(--bauhaus-red)]', 'bg-[var(--bauhaus-turquoise)]');
                    micWave.classList.add('scale-150', 'opacity-0', 'animate-ping');
                    messageBox.classList.add('hidden');
                } else {
                    statusDot.className = 'w-4 h-4 bg-slate-300 rounded-full border-2 border-black inline-block';
                    statusText.textContent = 'Sistema Inactivo';
                    micBtn.classList.replace('bg-[var(--bauhaus-turquoise)]', 'bg-[var(--bauhaus-red)]');
                    micWave.classList.remove('scale-150', 'opacity-0', 'animate-ping');
                }
            }

            function showMessage(text, isError = false) {
                messageBox.textContent = text;
                messageBox.classList.remove('hidden');
                messageBox.style.backgroundColor = isError ? 'var(--bauhaus-red)' : 'var(--bauhaus-turquoise)';
                messageBox.style.color = isError ? 'white' : 'var(--bauhaus-black)';
            }

            micBtn.addEventListener('click', () => {
                if (isRecording) {
                    stopRecording();
                } else {
                    try { recognition.start(); } catch(e) {}
                }
            });

            clearBtn.addEventListener('click', () => {
                const spans = transcriptContainer.querySelectorAll('span:not(#placeholder)');
                spans.forEach(span => span.remove());
                
                placeholder.style.display = 'block';
                clearBtn.classList.add('opacity-0', 'pointer-events-none');
                segmentMaxVolume = 0;
            });
        });
    </script>
</body>
</html>
